spin_manifest_version = 2

[application]
authors = ["Gul Madred", "Edward Jellico", "JL"]
description = "A simple application that returns the number of lights"
name = "chain-of-command"
version = "6.11.2"

[[trigger.http]]
route = "/has-middleware"
component = "four-lights"
dependencies.middleware = [{ path = "wasm/dummy.wasm" }, { component = "middly2" }]

[[trigger.http]]
route = "/doesnt-have-middleware"
component = "five-lights"

[[trigger.http]]
route = "/same-comp-different-mw1"
component = "six-lights"
dependencies.middleware = [{ path = "wasm/dummy.wasm" }]

[[trigger.http]]
route = "/same-comp-different-mw2"
component = "six-lights"
dependencies.middleware = [{ component = "middly2" }]

[component.four-lights]
source = "wasm/dummy.wasm"

[component.five-lights]
source = "wasm/dummy.wasm"

[component.six-lights]
source = "wasm/dummy.wasm"

[component.middly2]
source = "wasm/dummy2.wasm"
