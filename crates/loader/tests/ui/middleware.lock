            },
            "export": null
          }
        ]
      },
      "host_requirements": {
        "middleware": "required"
      }
    },
    {
      "id": "six-lights-for-http-trigger1",
      "metadata": {
        "resolve-trigger-dependencies-using": "http"
      },
      "source": {
        "content_type": "application/wasm",
