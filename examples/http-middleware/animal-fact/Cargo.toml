[package]
name = "animal-fact-middleware"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spin-sdk = { git = "https://github.com/spinframework/spin-rust-sdk", branch = "main", default-features = false, features = ["http", "http-middleware"] }

