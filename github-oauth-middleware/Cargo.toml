[package]
name = "github-oauth"
authors = ["Michelle Dhanani <mdhanani@akamai.com>"]
description = "github oauth middleware"
version = "0.1.0"
rust-version = "1.93"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
bytes = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spin-sdk = { git = "https://github.com/spinframework/spin-rust-sdk", branch = "main", features = ["http-middleware"] }
[workspace]